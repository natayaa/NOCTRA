[pytest]
# Root-level config so plain `pytest` and `pytest tests` behave identically.
# Without it, a bare invocation misses the config and falls back to
# pytest-asyncio strict mode, where plain async fixtures declared with
# @pytest.fixture are not wrapped (confusing "no plugin handled it" errors).
pythonpath = .
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
filterwarnings =
    ignore::DeprecationWarning:passlib.*
    ignore::DeprecationWarning:jose.*
    ignore::DeprecationWarning:pkg_resources.*
