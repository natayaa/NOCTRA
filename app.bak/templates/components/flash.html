{% if flash_messages %}
<div class="flash-stack" role="region" aria-label="Notifications">
  {% for flash in flash_messages %}
    <div class="flash flash-{{ flash.kind }}"
         role="{{ 'alert' if flash.kind == 'error' else 'status' }}"
         data-auto-dismiss="{{ '6000' if flash.kind == 'error' else '4000' }}">
      <div class="flex-1">{{ flash.message }}</div>
      <button type="button" class="flash-close" aria-label="Dismiss">×</button>
    </div>
  {% endfor %}
</div>
{% endif %}
