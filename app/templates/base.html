<!DOCTYPE html>
<html lang="{% block html_lang %}en{% endblock %}" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#070b16" />
  <meta name="format-detection" content="telephone=no, address=no, email=no" />

  <meta name="csrf-token" content="{{ csrf_token or '' }}" />
  <meta name="csrf-cookie-name" content="{{ csrf_cookie_name or 'noctra_csrf' }}" />
  <meta name="csrf-header-name" content="{{ csrf_header_name or 'X-CSRF-Token' }}" />

  <title>{% block title %}{{ title or "NOCTRA Autoworks" }}{% endblock %}</title>

  <meta name="description"
    content="{% block meta_description %}NOCTRA Autoworks — precision motorcycle refinishing, restoration, and custom paint.{% endblock %}" />
  <meta name="robots" content="{% block meta_robots %}noindex, nofollow{% endblock %}" />

  <meta property="og:type" content="{% block og_type %}website{% endblock %}" />
  <meta property="og:site_name" content="{{ app_name }}" />
  <meta property="og:title" content="{% block og_title %}{{ title or app_name }}{% endblock %}" />
  <meta property="og:description" content="{% block og_description %}{{ self.meta_description() }}{% endblock %}" />
  <meta property="og:image" content="{% block og_image %}/static/img/og-default.png{% endblock %}" />
  <meta property="og:url" content="{% block og_url %}{{ request.url if request else '' }}{% endblock %}" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{ self.og_title() }}" />
  <meta name="twitter:description" content="{{ self.og_description() }}" />
  <meta name="twitter:image" content="{{ self.og_image() }}" />

  <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg" />
  <link rel="apple-touch-icon" href="/static/img/logo-mark.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" />

  <link rel="stylesheet" href="/static/css/main.css" />
  {% block shell_css %}{% endblock %}
  {% block extra_css %}{% endblock %}

  <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin />
  <script src="https://cdn.tailwindcss.com/3.4.5"></script>
  <script>
    window.tailwind = window.tailwind || {};
    window.tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bg: '#070b16',
            surface: { DEFAULT: '#0d1220', 2: '#111827', 3: '#1a2030' },
            accent: { DEFAULT: '#0ea5e9', bright: '#38bdf8', deep: '#0284c7' },

            /* ── Dipakai oleh dashboard.html & login.html ── */
            noctra: {
              bg: '#070b16',
              surface: '#0d1220',
              surface2: '#111827',
              surface3: '#1a2030',
              border: 'rgba(148,163,184,0.08)',
              accent: '#0ea5e9',
              success: '#10b981',
              warning: '#f59e0b',
              danger: '#ef4444',
              info: '#0ea5e9',
              text: '#f1f5f9',
              muted: '#94a3b8',
              dim: '#64748b',
              faint: '#475569',
            },
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
          },
        },
      },
    };
  </script>

  <script defer src="https://unpkg.com/htmx.org@2.0.3"></script>
  <script defer src="/static/js/csrf.js"></script>
  <script defer src="/static/js/flash.js"></script>
  <script defer src="/static/js/main.js"></script>
  <script defer src="/static/js/confirm.js"></script>
  <script defer src="/static/js/htmx-config.js"></script>

  {% block extra_head %}{% endblock %}
</head>

<body class="{% block body_class %}{% endblock %}">

  <a href="#main-content" class="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-[100]
           focus:px-4 focus:py-2 focus:rounded-lg focus:bg-accent focus:text-white focus:shadow-lg">
    Skip to content
  </a>

  <noscript>
    <div style="padding:16px;background:#1a2030;color:#f1f5f9;border-bottom:1px solid rgba(148,163,184,.16)">
      NOCTRA memerlukan JavaScript. Tolong aktifkan dan muat ulang.
    </div>
  </noscript>

  {% include 'components/flash.html' %}

  {% block body %}{% endblock %}

  {% block extra_js %}{% endblock %}
</body>

</html>
