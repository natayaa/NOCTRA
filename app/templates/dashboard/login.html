<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | NOCTRA Autoworks</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" />
    <link rel="stylesheet" href="{{ url_for('static', path='includes/css/login.css') }}" />
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-brand">
                <div class="brand-icon">N</div>
                <h1>NOCTRA</h1>
                <span>Workshop Management System</span>
            </div>

            <form id="loginForm" class="login-form" novalidate>
                <div class="form-group">
                    <label for="username">Username or Email</label>
                    <div class="input-wrapper">
                        <i class="ri-user-line"></i>
                        <input type="text" id="username" placeholder="Enter your username or email" required />
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="ri-lock-line"></i>
                        <input type="password" id="password" placeholder="Enter your password" required />
                        <button type="button" class="toggle-password" id="togglePassword">
                            <i class="ri-eye-line"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember" />
                        <span>Remember me</span>
                    </label>
                    <a href="/forgot-password" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <span>Sign In</span>
                    <i class="ri-arrow-right-line"></i>
                </button>

                <div class="login-error" id="loginError" style="display:none;"></div>
            </form>

            <div class="login-footer">
                <p>&copy; 2026 NOCTRA Autoworks. All rights reserved.</p>
            </div>
        </div>

        <div class="login-background">
            <div class="bg-overlay"></div>
            <div class="bg-text">
                <h2>Built in the Dark.</h2>
                <p>Finished to Perfection.</p>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', path='js/api/client.js') }}"></script>
    <script src="{{ url_for('static', path='js/api/auth.js') }}"></script>
    <script src="{{ url_for('static', path='js/login.js') }}"></script>
</body>
</html>
