
<link
  rel="stylesheet"
  href="{{ url_for('static', path='css/inquiry.css') }}"
/>

<div class="inquiry-wrapper">
  <form class="inquiry-form">
    <div class="wizard-progress">
      <div class="progress-line"></div>

      <div class="step active" data-step="1">
        <span>1</span>
        <small>Vehicle</small>
      </div>

      <div class="step" data-step="2">
        <span>2</span>
        <small>Service</small>
      </div>

      <div class="step" data-step="3">
        <span>3</span>
        <small>Details</small>
      </div>
    </div>

    <!-- STEP 1 -->

    <div class="wizard-page active">
      <div class="form-header">
        <h2>Vehicle Information</h2>

        <p>Tell us about your motorcycle.</p>
      </div>

      <div class="input-group">
        <label>Nama Lengkap</label>
        <input id="fullname" type="text" />
      </div>

      <div class="input-group">
        <label>Nomor WhatsApp</label>
        <input id="phone_number" type="text" />
      </div>

      <div class="input-group">
        <label>Nomor Polisi</label>

        <div class="plate-input">
          <input class="plate-prefix" maxlength="2" placeholder="D" />

          <span>-</span>

          <input class="plate-number" maxlength="4" placeholder="7734" />

          <span>-</span>

          <input class="plate-suffix" maxlength="3" placeholder="KK" />
        </div>
      </div>

      <div class="grid">
        <div class="input-group">
          <label>Merk</label>

          <select id="bike_brand">
            <option>YAMAHA</option>
            <option>HONDA</option>
            <option>KAWASAKI</option>
            <option>SUZUKI</option>
          </select>
        </div>

        <div class="input-group">
          <label>Model</label>

          <input id="bike_model" type="text" />
        </div>
      </div>
    </div>

    <!-- STEP 2 -->

    <div class="wizard-page">
      <div class="form-header">
        <h2>Requested Services</h2>
      </div>

      <div class="service-grid">
        <label class="service-card">
          <input type="checkbox" />

          <i class="ri-brush-line"></i>

          <span>Body Repaint</span>
        </label>

        <label class="service-card">
          <input type="checkbox" />

          <i class="ri-tools-line"></i>

          <span>Restoration</span>
        </label>

        <label class="service-card">
          <input type="checkbox" />

          <i class="ri-settings-3-line"></i>

          <span>Velg Repaint</span>
        </label>

        <label class="service-card">
          <input type="checkbox" />

          <i class="ri-speed-up-line"></i>

          <span>CVT Service</span>
        </label>

        <label class="service-card">
          <input type="checkbox" />

          <i class="ri-gas-station-line"></i>

          <span>Carburetor</span>
        </label>
      </div>

      <div class="input-group">
        <label>Kondisi Kendaraan</label>

        <select id="body_condition">
          <option>Goresan Ringan</option>
          <option>Rusak Sedang</option>
          <option>Rusak Berat</option>
          <option>Full Restoration</option>
        </select>
      </div>
    </div>

    <!-- STEP 3 -->

    <div class="wizard-page">
      <div class="form-header">
        <h2>Project Details</h2>
      </div>

      <div class="input-group">
        <label>Deskripsi</label>

        <textarea id="project_details" rows="5"></textarea>
      </div>

      <div class="input-group">
        <label>Reference Link</label>

        <input id="reference_link" type="text" />
      </div>

      <div class="input-group">
        <label>Upload Photos</label>

        <input id="project_photos" type="file" multiple accept="image/*" />
      </div>
    </div>

    <div class="wizard-actions">
      <button type="button" id="prevBtn" class="btn btn-secondary">
        Back
      </button>

      <div class="wizard-actions-right">
        <button type="button" id="nextBtn" class="btn btn-primary">
          Continue
        </button>

        <button type="submit" id="submitBtn" class="btn btn-primary">
          Submit Project
        </button>
      </div>
    </div>
  </form>
</div>

<script src="{{ url_for('static', path='/js/inquiry.js') }}"></script>
