{% extends "admin/base.html" %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">Settings</h1>
    <p class="page-subtitle">Application configuration</p>
  </div>
</div>

<form method="post" action="/admin/settings" class="panel max-w-3xl space-y-4" data-guard>
  {% for s in settings_list %}
  <div class="form-row">
    <label class="form-label" for="setting-{{ s.key }}">
      <span class="font-mono text-xs">{{ s.key }}</span>
      {% if s.description %}<span class="text-neutral-500 ml-2">{{ s.description }}</span>{% endif %}
    </label>
    <input class="input" id="setting-{{ s.key }}" name="{{ s.key }}" value="{{ s.value or '' }}" />
  </div>
  {% endfor %}

  <input type="hidden" name="_csrf" value="{{ csrf_token or '' }}" />

  <div class="pt-2">
    <button class="btn btn-primary">Save changes</button>
  </div>
</form>
{% endblock %}
