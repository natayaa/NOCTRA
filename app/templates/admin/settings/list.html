{% extends "admin/base.html" %}
{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">Settings</h1>
    <p class="page-subtitle">{{ total }} keys</p>
  </div>
</div>

<form method="post" action="/admin/settings" class="space-y-6" data-guard>
  <input type="hidden" name="_csrf" value="{{ csrf_value(request) }}" />

  {% for category, items in settings_groups.items() | sort %}
  <div class="panel">
    <div class="panel-title">{{ category.replace('_', ' ').title() }}</div>
    <div class="mt-4 space-y-4">
      {% for s in items %}
      <div class="form-row !mb-0">
        <label class="form-label" for="setting-{{ s.key }}">
          <span class="mono text-xs">{{ s.key }}</span>
          {% if s.description %}<span class="text-neutral-500 ml-2">{{ s.description }}</span>{% endif %}
        </label>
        <input class="input" id="setting-{{ s.key }}" name="{{ s.key }}"
               value="{{ s.value or '' }}"
               {% if s.is_secret %}type="password"{% endif %} />
      </div>
      {% endfor %}
    </div>
  </div>
  {% endfor %}

  <div class="sticky bottom-4 panel flex justify-end gap-3" style="background: var(--surface);">
    <button class="btn btn-primary">Save all changes</button>
  </div>
</form>
{% endblock %}
