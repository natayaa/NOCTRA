{% extends "admin/base.html" %}
{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">Roles</h1>
    <p class="page-subtitle">{{ roles | length }} roles</p>
  </div>
</div>

<div class="table-wrap">
  <table class="table">
    <thead>
      <tr>
        <th>Role</th>
        <th>Description</th>
        <th class="text-right">Permissions</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {% for r in roles %}
      <tr>
        <td>
          <div class="font-medium">{{ r.name }}</div>
          {% if r.is_system %}<div class="text-xs text-neutral-500">system</div>{% endif %}
        </td>
        <td class="text-sm text-neutral-400">{{ r.description or '—' }}</td>
        <td class="text-right font-mono text-sm">{{ permission_counts.get(r.id, 0) }}</td>
        <td class="text-right">
          <a href="/admin/roles/{{ r.id }}" class="btn btn-ghost btn-sm">View</a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
