{% if customers %}
  {% for c in customers %}
  <button type="button"
        class="js-customer-option w-full text-left px-3 py-2 hover:bg-noctra-surface2 focus:bg-noctra-surface2 focus:outline-none border-b border-noctra-border last:border-0 transition"
        ...>
  <div class="font-medium text-sm">{{ c.name }}</div>
  <div class="text-xs text-noctra-dim">
    {{ c.code }}{% if c.phone %} · {{ c.phone }}{% endif %}
  </div>
</button>
  {% endfor %}
{% elif q %}
  <div class="px-3 py-3 text-xs text-neutral-500">No matches for "{{ q }}"</div>
{% else %}
  <div class="px-3 py-3 text-xs text-neutral-500">Start typing to search…</div>
{% endif %}
