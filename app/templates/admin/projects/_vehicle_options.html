{% if vehicles %}
{% for v in vehicles %}
<button type="button"
  class="js-vehicle-option w-full text-left px-3 py-2 hover:bg-noctra-surface2 focus:bg-noctra-surface2 focus:outline-none border-b border-noctra-border last:border-0 transition"
  ...>
  <div class="font-medium text-sm">{{ v.brand }} {{ v.model }}</div>
  <div class="text-xs text-noctra-dim">...</div>
</button>
{% endfor %}
{% elif customer_id %}
<div class="px-3 py-3 text-xs text-neutral-500">
  No vehicles for this customer. Leave blank or add one later.
</div>
{% else %}
<div class="px-3 py-3 text-xs text-neutral-500">Select a customer first.</div>
{% endif %}
