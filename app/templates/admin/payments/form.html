{% extends "admin/base.html" %}
{% block content %}
<div class="page-header">
  <div><h1 class="page-title">Record {{ 'payment in' if direction == 'IN' else 'payment out' }}</h1></div>
  <div class="page-actions"><a href="/admin/payments" class="btn btn-secondary btn-sm">Back</a></div>
</div>

<form method="post" action="/admin/payments" class="max-w-2xl panel space-y-5" data-guard>
  <input type="hidden" name="_csrf" value="{{ csrf_value(request) }}" />
  <input type="hidden" name="direction" value="{{ direction }}" />

  <div class="grid md:grid-cols-2 gap-5">
    <div class="form-row">
      <label class="form-label" for="method">Method</label>
      <select class="select" id="method" name="method">
        {% for m in payment_methods %}<option value="{{ m }}">{{ payment_method_labels.get(m, m) }}</option>{% endfor %}
      </select>
    </div>
    <div class="form-row">
      <label class="form-label" for="amount">Amount (IDR) <span class="req">*</span></label>
      <input class="input" type="number" step="1000" id="amount" name="amount" required />
    </div>
  </div>

  <div class="grid md:grid-cols-2 gap-5">
    <div class="form-row">
      <label class="form-label" for="payment_date">Payment date <span class="req">*</span></label>
      <input class="input" type="date" id="payment_date" name="payment_date" required value="{{ today }}" />
    </div>
    <div class="form-row">
      <label class="form-label" for="account_id">Account</label>
      <select class="select" id="account_id" name="account_id">
        <option value="">—</option>
        {% for a in accounts %}<option value="{{ a.id }}">{{ a.code }} — {{ a.name }}</option>{% endfor %}
      </select>
    </div>
  </div>

  {% if direction == 'IN' %}
  <div class="form-row">
    <label class="form-label" for="customer_id">Customer ID</label>
    <input class="input mono" id="customer_id" name="customer_id" placeholder="paste UUID (optional)" />
  </div>
  {% else %}
  <div class="form-row">
    <label class="form-label" for="supplier_id">Supplier ID</label>
    <input class="input mono" id="supplier_id" name="supplier_id" placeholder="paste UUID (optional)" />
  </div>
  {% endif %}

  <div class="grid md:grid-cols-2 gap-5">
    <div class="form-row">
      <label class="form-label" for="reference_number">Reference number</label>
      <input class="input" id="reference_number" name="reference_number" maxlength="100" placeholder="bank ref, receipt no." />
    </div>
    <div class="form-row">
      <label class="form-label" for="notes">Notes</label>
      <input class="input" id="notes" name="notes" />
    </div>
  </div>

  <div class="flex gap-2 pt-2">
    <button class="btn btn-primary">Record payment</button>
    <a href="/admin/payments" class="btn btn-secondary">Cancel</a>
  </div>
</form>
{% endblock %}
