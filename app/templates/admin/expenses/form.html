{% extends "admin/base.html" %}
{% block content %}
{% set fv = form_values or {} %}
<div class="page-header">
  <div><h1 class="page-title">{{ 'New Expense' if mode == 'create' else 'Edit Expense' }}</h1></div>
  <div class="page-actions"><a href="/admin/expenses" class="btn btn-secondary btn-sm">Back</a></div>
</div>

{% if error %}<div class="panel mb-4" style="border-color: rgba(239,68,68,0.4);"><div class="form-error">{{ error }}</div></div>{% endif %}

<form method="post" action="{{ '/admin/expenses' if mode == 'create' else '/admin/expenses/' ~ expense.id }}"
      class="max-w-2xl panel space-y-5" data-guard>
  <input type="hidden" name="_csrf" value="{{ csrf_value(request) }}" />

  <div class="form-row">
    <label class="form-label" for="category">Category <span class="req">*</span></label>
    <select class="select" id="category" name="category" required>
      {% for c in categories %}
        {% set cur = fv.get('category') or (expense.category if expense else '') %}
        <option value="{{ c }}" {% if cur == c %}selected{% endif %}>{{ category_labels.get(c, c) }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="form-row">
    <label class="form-label" for="description">Description <span class="req">*</span></label>
    <input class="input" id="description" name="description" required maxlength="500"
           value="{{ fv.get('description') or (expense.description if expense else '') }}" />
  </div>

  <div class="grid md:grid-cols-2 gap-5">
    <div class="form-row">
      <label class="form-label" for="amount">Amount (IDR) <span class="req">*</span></label>
      <input class="input" type="number" step="1000" id="amount" name="amount" required
             value="{{ fv.get('amount') or (expense.amount if expense else '') }}" />
    </div>
    <div class="form-row">
      <label class="form-label" for="expense_date">Date <span class="req">*</span></label>
      <input class="input" type="date" id="expense_date" name="expense_date" required
             value="{{ fv.get('expense_date') or (expense.expense_date.strftime('%Y-%m-%d') if expense else today) }}" />
    </div>
  </div>

  <div class="grid md:grid-cols-2 gap-5">
    <div class="form-row">
      <label class="form-label" for="account_id">Account</label>
      <select class="select" id="account_id" name="account_id">
        <option value="">—</option>
        {% for a in accounts %}
          {% set cur = fv.get('account_id') or (expense.account_id|string if expense and expense.account_id else '') %}
          <option value="{{ a.id }}" {% if cur == a.id|string %}selected{% endif %}>{{ a.code }} — {{ a.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-row">
      <label class="form-label" for="reference_number">Reference number</label>
      <input class="input" id="reference_number" name="reference_number" maxlength="100"
             value="{{ fv.get('reference_number') or (expense.reference_number if expense else '') }}" />
    </div>
  </div>

  <div class="form-row">
    <label class="form-label" for="notes">Notes</label>
    <textarea class="textarea" id="notes" name="notes" rows="2">{{ fv.get('notes') or (expense.notes if expense else '') }}</textarea>
  </div>

  <div class="flex gap-2 pt-2">
    <button class="btn btn-primary">{{ 'Create' if mode == 'create' else 'Save changes' }}</button>
    <a href="/admin/expenses" class="btn btn-secondary">Cancel</a>
    {% if mode == 'edit' %}
    <form method="post" action="/admin/expenses/{{ expense.id }}/delete" data-confirm="Delete this expense?">
      <input type="hidden" name="_csrf" value="{{ csrf_value(request) }}" />
      <button class="btn btn-danger ml-auto">Delete</button>
    </form>
    {% endif %}
  </div>
</form>
{% endblock %}
