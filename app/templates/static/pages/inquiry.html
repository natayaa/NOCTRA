<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NOCTRA Inquiry</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">

    <link rel="stylesheet" href="/css/inquiry.css">

</head>

<body>

    <div class="page">

        <!-- LEFT -->

        <div class="left-side">

            <div class="overlay"></div>

            <div class="hero-content">

                <div class="tag">
                    Premium Workshop Inquiry
                </div>

                <h1>
                    NOCTRA <br>
                    AUTOWORKS
                </h1>

                <p>
                    Request premium repaint, restoration,
                    detailing and custom motorcycle services.
                </p>

                <div class="features">

                    <div class="feature">
                        <i class="ri-check-line"></i>
                        Premium paint quality
                    </div>

                    <div class="feature">
                        <i class="ri-check-line"></i>
                        Restoration specialists
                    </div>

                    <div class="feature">
                        <i class="ri-check-line"></i>
                        Fast customer response
                    </div>

                </div>

            </div>

        </div>

        <!-- RIGHT -->

        <div class="right-side">

            <form class="inquiry-form">

                <div class="form-header">

                    <h2>Customer Inquiry</h2>

                    <p>
                        Submit your motorcycle project request.
                    </p>

                </div>

                <div class="input-group">

                    <label>Full Name</label>

                    <input type="text" placeholder="Your full name">

                </div>

                <div class="grid">

                    <div class="input-group">

                        <label>Phone Number</label>

                        <input type="text" placeholder="+62 xxx">

                    </div>

                    <div class="input-group">

                        <label>Motorbike</label>

                        <input type="text" placeholder="Mio Sporty">

                    </div>

                </div>

                <div class="grid">

                    <div class="input-group">

                        <label>Service Type</label>

                        <select>

                            <option>Body Repaint</option>
                            <option>Restoration</option>
                            <option>Velg Repaint</option>
                            <option>Detailing</option>
                            <option>CVT Service</option>

                        </select>

                    </div>

                    <div class="input-group">

                        <label>Estimated Budget</label>

                        <input type="text" placeholder="Rp 5.000.000">

                    </div>

                </div>

                <div class="input-group">

                    <label>Project Details</label>

                    <textarea rows="5" placeholder="Describe your motorcycle project..."></textarea>

                </div>

                <div class="input-group">

                    <label>Reference Link / Instagram</label>

                    <input type="text" placeholder="https://...">

                </div>

                <button type="submit" class="submit-btn">

                    <i class="ri-send-plane-line"></i>

                    Submit Inquiry

                </button>

            </form>

        </div>

    </div>

    <script src="/js/inquiry.js"></script>

</body>

</html>
