# pytest.ini
[pytest]
# Python path
pythonpath = app

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Add options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=modules
    --cov-report=html
    --cov-report=term
    --cov-report=xml

# Markers
markers =
    unit: Unit tests
    integration: Integration tests (requires database)
    api: API endpoint tests
    slow: Slow running tests
    async: Async tests

# Test paths
testpaths = tests

# Asyncio mode
asyncio_mode = auto