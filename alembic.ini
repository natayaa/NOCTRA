# ============================================================
# NOCTRA Autoworks — Alembic configuration
# ============================================================

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Set at runtime in env.py from app.core.config.settings — leave blank here.
sqlalchemy.url =

# Timestamped filenames so `ls` sorts chronologically.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

timezone = UTC
truncate_slug_length = 40

# Run ruff on each new revision file to keep formatting consistent.
# Post-write hooks disabled — ruff not installed in this environment.
# [post_write_hooks]
# hooks = ruff_format
# ruff_format.type = console_scripts
# ruff_format.entrypoint = ruff
# ruff_format.options = format REVISION_SCRIPT_FILENAME

# ------------------------------------------------------------
# Logging
# ------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S