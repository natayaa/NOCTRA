# ==================================================================
# NOCTRA - Alembic configuration
#
# The database URL is NOT stored here. alembic/env.py reads it from
# app.core.config.settings (and therefore from .env), so credentials
# have exactly one home.
#
# Common commands:
#   alembic upgrade head                 apply all pending migrations
#   alembic current                      show the applied revision
#   alembic history --verbose            list revisions
#   alembic revision --autogenerate -m "add table"
#   alembic downgrade -1                 roll back one revision
#   alembic upgrade head --sql           print SQL without connecting
# ==================================================================

[alembic]
# Directory containing env.py, script.py.mako and versions/.
script_location = alembic

# Make the project root importable so `app.*` resolves from any CWD.
prepend_sys_path = .

# Split multiple version locations using the OS path separator.
version_path_separator = os

# Injected at runtime by alembic/env.py - leave blank.
sqlalchemy.url =

# Filenames sort chronologically:
# 20261021_0343_de9d8331a6ff_pre_migration_baseline.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Revision timestamps are in UTC, regardless of the host's local time.
timezone = UTC

# Keep slugs short enough to read in a terminal.
truncate_slug_length = 40


# ==================================================================
# Logging
#
# Warnings only by default; `alembic` itself logs at INFO so migration
# progress is visible without enabling SQL echo.
# ==================================================================

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic


[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
