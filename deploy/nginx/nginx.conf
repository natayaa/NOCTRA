# ══════════════════════════════════════════════════════════════════
# NOCTRA — nginx main configuration
#
# Mounted read-only into the nginx container:
#   ./deploy/nginx/nginx.conf   → /etc/nginx/nginx.conf
#   ./deploy/nginx/conf.d       → /etc/nginx/conf.d
# ══════════════════════════════════════════════════════════════════

user  nginx;
worker_processes  auto;
pid /var/run/nginx.pid;

error_log /var/log/nginx/error.log warn;

events {
    worker_connections  1024;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Do not advertise the version in responses or error pages.
    server_tokens off;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 4096;

    # Uploads are validated by the app (10 MB per photo, 5 photos). The
    # proxy allowance leaves room for multipart overhead.
    client_max_body_size 64m;
    client_body_timeout  60s;

    # Brotli is not bundled with the stock image; gzip is enough here.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    include /etc/nginx/conf.d/*.conf;
}
