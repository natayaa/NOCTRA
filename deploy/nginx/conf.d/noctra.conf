# ══════════════════════════════════════════════════════════════════
# NOCTRA — HTTP reverse proxy (default)
#
# Terminates no TLS. Use the example in ../examples/noctra-tls.conf
# when the host is public. The application sets CSP, HSTS (production
# only), X-Frame-Options and the other security headers itself, so
# they are deliberately not duplicated here.
# ══════════════════════════════════════════════════════════════════

upstream noctra_app {
    server app:8000;
    keepalive 32;
}

server {
    listen 80 default_server;
    server_name _;

    # ── Forwarding contract ───────────────────────────────────────
    # X-Forwarded-For is OVERWRITTEN with the real peer address, never
    # appended. Combined with TRUST_PROXY_HEADERS=true in the app this
    # prevents a client from spoofing its IP and bypassing rate limits.
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    proxy_connect_timeout 5s;
    proxy_send_timeout    75s;
    proxy_read_timeout    75s;
    proxy_redirect        off;
    proxy_buffering       on;

    # ── Probes ────────────────────────────────────────────────────
    # `/healthz` is liveness, `/readyz` checks PostgreSQL. Keep them
    # out of the access log so orchestrator probes do not flood it.
    location = /healthz {
        proxy_pass http://noctra_app;
        access_log off;
    }

    location = /readyz {
        proxy_pass http://noctra_app;
        access_log off;
    }

    # ── Static assets ─────────────────────────────────────────────
    # Served by the app (single source of truth); cached briefly so a
    # deploy is visible quickly without re-fetching on every page.
    location /static/ {
        proxy_pass http://noctra_app;
        expires 1h;
        access_log off;
    }

    # Uploaded inquiry photos have UUID filenames and never change.
    location /media/ {
        proxy_pass http://noctra_app;
        expires 30d;
        access_log off;
    }

    # Never serve dotfiles (nginx defaults would allow some of them).
    location ~ /\.(?!well-known) {
        deny all;
    }

    # ── Application ───────────────────────────────────────────────
    location / {
        proxy_pass http://noctra_app;
    }
}
