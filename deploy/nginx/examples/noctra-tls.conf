# ══════════════════════════════════════════════════════════════════
# NOCTRA — HTTPS reverse proxy (example)
#
# This file is NOT loaded by default. To use it:
#
#   1. Obtain certificates, e.g.:
#        mkdir -p deploy/nginx/certs
#        cp /etc/letsencrypt/live/example.com/fullchain.pem deploy/nginx/certs/
#        cp /etc/letsencrypt/live/example.com/privkey.pem   deploy/nginx/certs/
#   2. Mount them read-only in docker-compose.yml under the nginx service:
#        - ./deploy/nginx/certs:/etc/nginx/certs:ro
#      and publish port 443:
#        - "${HTTPS_PORT:-8443}:443"
#   3. Replace the HTTP file:
#        mv deploy/nginx/conf.d/noctra.conf deploy/nginx/conf.d/noctra.http.conf.bak
#        cp deploy/nginx/examples/noctra-tls.conf deploy/nginx/conf.d/noctra.conf
#   4. Set in .env.docker:
#        APP_ENV=production
#        APP_DEBUG=false
#        SESSION_COOKIE_SECURE=true
#        APP_BASE_URL=https://example.com
#        TRUSTED_HOSTS=example.com,www.example.com
#        TRUST_PROXY_HEADERS=true
#   5. Recreate the stack: make docker-up
#
# The app emits HSTS itself when APP_ENV=production, so it is not
# duplicated here. Adjust certificate paths and `server_name` first.
# ══════════════════════════════════════════════════════════════════

upstream noctra_app {
    server app:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Certbot HTTP-01 challenge (optional).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name example.com www.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:NOCTRA_TLS:10m;
    ssl_session_timeout 1d;

    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    proxy_connect_timeout 5s;
    proxy_send_timeout    75s;
    proxy_read_timeout    75s;
    proxy_redirect        off;

    location = /healthz {
        proxy_pass http://noctra_app;
        access_log off;
    }

    location = /readyz {
        proxy_pass http://noctra_app;
        access_log off;
    }

    location /static/ {
        proxy_pass http://noctra_app;
        expires 1h;
        access_log off;
    }

    location /media/ {
        proxy_pass http://noctra_app;
        expires 30d;
        access_log off;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location / {
        proxy_pass http://noctra_app;
    }
}
